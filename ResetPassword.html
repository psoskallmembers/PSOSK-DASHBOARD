<!DOCTYPE html>
<html>
  <head>
    <script src="gas-run-shim.js"></script>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSOSK - Reset Password</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
      body{background:linear-gradient(135deg,#1A73E8,#0d47a1);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
      .container{background:#fff;border-radius:16px;padding:40px;max-width:450px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
      .container h1{color:#1A73E8;font-size:24px;text-align:center;margin-bottom:5px}
      .container .subtitle{text-align:center;color:#5f6368;font-size:14px;margin-bottom:25px}
      .form-group{margin-bottom:12px}
      .form-group label{display:block;font-size:13px;font-weight:600;color:#5f6368;margin-bottom:4px}
      .form-group label .required{color:#EA4335}
      .form-group input{width:100%;padding:10px 14px;border:1px solid #dadce0;border-radius:8px;font-size:14px}
      .form-group input:focus{outline:none;border-color:#1A73E8;box-shadow:0 0 0 2px rgba(26,115,232,0.2)}
      .form-group input[readonly]{background:#f5f5f5;color:#333}
      .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.3s;margin-top:5px}
      .btn-primary{background:#1A73E8;color:#fff}
      .btn-primary:hover{background:#1557b0}
      .btn:disabled{opacity:0.7;cursor:not-allowed}
      .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:16px 32px;border-radius:10px;color:#fff;font-size:16px;font-weight:600;z-index:9999;display:none;text-align:center;min-width:300px;max-width:90%;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
      .toast.success{background:#34A853}
      .toast.error{background:#EA4335}
      .info-box{background:#e8f0fe;padding:15px;border-radius:8px;margin-bottom:15px;font-size:14px;color:#1A73E8;text-align:center;line-height:1.6}
      .info-box .highlight{background:#fff;padding:2px 10px;border-radius:4px;font-weight:700}
      .footer{margin-top:20px;text-align:center;font-size:12px;color:#9e9e9e}
      .back-link{text-align:center;margin-top:15px}
      .back-link a{color:#1A73E8;text-decoration:none;cursor:pointer}
      .back-link a:hover{text-decoration:underline}
      .code-hint{font-size:12px;color:#5f6368;margin-top:4px;padding-left:4px}

      html{overflow-x:hidden}
      @media(max-width:600px){
        body{padding:12px}
        .container{padding:28px 20px}
      }
      @media(max-width:480px){
        .container{padding:24px 16px;border-radius:12px}
        .container h1{font-size:20px}
        .container .subtitle{font-size:13px}
        .info-box{padding:12px;font-size:13px}
        .form-group input{padding:9px 12px;font-size:13px}
        .btn{font-size:14px;padding:11px}
        .toast{min-width:0;width:90%;padding:12px 18px;font-size:14px}
      }
      @media(max-width:360px){
        .container{padding:20px 14px}
      }
    </style>
  </head>
  <body>
    <div id="toast" class="toast"></div>

    <div class="container">
      <h1>🔐 PSOSK</h1>
      <p class="subtitle">পাসওয়ার্ড রিসেট করুন</p>

      <div class="info-box">
        📧 আপনার ই-মেইলে পাঠানো <span class="highlight">৬-সংখ্যার কোড</span> দিন<br>
        এবং নতুন পাসওয়ার্ড সেট করুন।
      </div>

      <form id="resetForm" onsubmit="submitReset(event)">
        <div class="form-group">
          <label>ই-মেইল <span class="required">*</span></label>
          <input type="email" id="resetEmail" placeholder="your@email.com" required readonly>
        </div>
        
        <div class="form-group">
          <label>রিসেট কোড <span class="required">*</span></label>
          <input type="text" id="resetCode" placeholder="৬-সংখ্যার কোড (যেমন: 123456)" required maxlength="6" inputmode="numeric" pattern="[0-9]{6}">
          <div class="code-hint">📩 আপনার ই-মেইল থেকে ৬-সংখ্যার কোড কপি করে দিন</div>
        </div>
        
        <div class="form-group">
          <label>নতুন পাসওয়ার্ড <span class="required">*</span></label>
          <input type="password" id="newPassword" placeholder="৬ অক্ষরের বেশি" required minlength="6">
        </div>
        
        <div class="form-group">
          <label>নতুন পাসওয়ার্ড নিশ্চিত করুন <span class="required">*</span></label>
          <input type="password" id="confirmPassword" placeholder="আবার পাসওয়ার্ড দিন" required>
        </div>
        
        <button type="submit" class="btn btn-primary" id="resetBtn">🔑 পাসওয়ার্ড পরিবর্তন করুন</button>
      </form>

      <div class="back-link">
        <a onclick="goToLogin()">← লগইন পেজে ফিরে যান</a>
      </div>

      <div class="footer">&copy; 2026 PSOSK - প্রতিবন্ধী সেবা ও সাহায্য কেন্দ্র</div>
    </div>

    <script>
      var urlParams = new URLSearchParams(window.location.search);
      var emailFromUrl = urlParams.get('email');
      var tokenFromUrl = urlParams.get('token');
      
      var emailField = document.getElementById('resetEmail');
      if (emailFromUrl) {
        emailField.value = emailFromUrl;
        console.log('📧 Email from URL:', emailFromUrl);
      } else {
        var storedEmail = localStorage.getItem('resetEmail');
        if (storedEmail) {
          emailField.value = storedEmail;
          console.log('📧 Email from localStorage:', storedEmail);
        }
      }
      
      if (tokenFromUrl && tokenFromUrl.length === 6) {
        document.getElementById('resetCode').value = tokenFromUrl;
        console.log('🔑 Token from URL:', tokenFromUrl);
      }

      function showToast(msg, type) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast ' + type;
        toast.style.display = 'block';
        setTimeout(function() { 
          toast.style.display = 'none'; 
        }, 5000);
      }

      function goToLogin() {
        google.script.run
          .withSuccessHandler(function(url) {
            window.top.location.href = url;
          })
          .withFailureHandler(function(error) {
            showToast('❌ Error: ' + (error.message || error), 'error');
          })
          .getScriptUrl();
      }

      function submitReset(e) {
        e.preventDefault();
        
        var email = document.getElementById('resetEmail').value.trim();
        var code = document.getElementById('resetCode').value.trim();
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var btn = document.getElementById('resetBtn');

        if (!email) {
          showToast('❌ ই-মেইল দিন!', 'error');
          return;
        }
        if (!code) {
          showToast('❌ ৬-সংখ্যার রিসেট কোড দিন!', 'error');
          return;
        }
        if (code.length !== 6) {
          showToast('❌ সঠিক ৬-সংখ্যার কোড দিন!', 'error');
          return;
        }
        if (!/^\d{6}$/.test(code)) {
          showToast('❌ কোডটি শুধুমাত্র সংখ্যা হতে হবে!', 'error');
          return;
        }
        if (newPassword !== confirmPassword) {
          showToast('❌ পাসওয়ার্ড মিলছে না!', 'error');
          return;
        }
        if (newPassword.length < 6) {
          showToast('❌ পাসওয়ার্ড ৬ অক্ষরের বেশি হতে হবে!', 'error');
          return;
        }

        btn.textContent = '⏳ পরিবর্তন হচ্ছে...';
        btn.disabled = true;

        console.log('📤 Sending reset - Email:', email, 'Code:', code);

        google.script.run
          .withSuccessHandler(function(result) {
            btn.textContent = '🔑 পাসওয়ার্ড পরিবর্তন করুন';
            btn.disabled = false;
            
            console.log('📥 Reset result:', result);
            
            if (result.success) {
              showToast('✅ ' + result.message, 'success');
              localStorage.removeItem('resetEmail');
              setTimeout(goToLogin, 2500);
            } else {
              showToast('❌ ' + result.error, 'error');
              document.getElementById('resetCode').focus();
              document.getElementById('resetCode').select();
            }
          })
          .withFailureHandler(function(error) {
            btn.textContent = '🔑 পাসওয়ার্ড পরিবর্তন করুন';
            btn.disabled = false;
            console.error('❌ Error:', error);
            showToast('❌ সার্ভার ত্রুটি: ' + (error.message || error), 'error');
          })
          .resetPassword({ 
            email: email, 
            code: code, 
            newPassword: newPassword 
          });
      }

      window.onload = function() {
        if (emailFromUrl) {
          document.getElementById('resetCode').focus();
        }
      };
    </script>
  </body>
</html>
